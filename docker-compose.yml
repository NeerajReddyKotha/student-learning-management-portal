version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: edunexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edunexus_db}
      POSTGRES_USER: ${POSTGRES_USER:-edunexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edunexus_secure_password_dev123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - edunexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edunexus_user} -d ${POSTGRES_DB:-edunexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edunexus-network

  # ----------------------------------------------------------------------------
  # EduNexus Backend Service (Spring Boot 3 / Java 21)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edunexus-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-edunexus_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-edunexus_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-edunexus_secure_password_dev123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - edunexus-network

  # ----------------------------------------------------------------------------
  # EduNexus Frontend Service (Next.js 14 / TypeScript)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edunexus-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: "EduNexus Academy"
      NEXT_PUBLIC_API_BASE_URL: http://backend:8080
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - edunexus-network

volumes:
  edunexus_postgres_data:
    driver: local

networks:
  edunexus-network:
    driver: bridge
